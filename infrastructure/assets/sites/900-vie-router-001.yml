# optional DNS settings
dns:
  conditionalForwards:
    muc.internal.muehlbachler.io: 10.255.1.2
    bhs.ovh.internal.muehlbachler.io: 10.51.0.1

# optional firewall settings
firewall:
  forwards:
    v4:
      - proto: tcp
        ports:
          - 80
          - 443
        to: 10.0.72.2
  # the LAN prefix is public: the cluster ingress is reached directly, without DNAT
  extraForwardRules: |
    ip6 daddr 2a01:aea0:dd3:25a:1000:3:3:2 tcp dport { 80, 443 } accept

# optional observability settings
observability:
  monitoring:
    prometheus:
      enabled: true
      exporters:
        - node
        - kea
        - frr
        - smartctl
        - crowdsec
        - nut
  logging:
    vector:
      enabled: true
      # the cluster's Vector (VIP; IPv6: [fc00:db8:111::200:1]:6000)
      address: 10.111.200.1:6000

# optional transport settings
transport:
  netbird:
    enabled: true

# required BGP settings
bgp:
  enabled: true
  asn: 201421
  evpn:
    enabled: true
  # transit: never for a neighbor that is itself a site (it would re-announce that site's prefixes: a loop)
  peers:
    - name: home-cluster
      address: "2a01:aea0:dd3:25a:1000:1:1:1"
      remoteAs: 64551
      interface: lan0
      disableConnectedCheck: true
      nextHopSelf: true
      outPolicy: deny-all
      transit: true
