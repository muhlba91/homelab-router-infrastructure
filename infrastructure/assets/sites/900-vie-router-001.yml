---
# required site settings
name: vie-router-001
enabled: false

# required hardware settings
hardware:
  # stand-in: the physical box (igc NICs, NVMe) needs its own profile
  profile: qemu
  disk: /dev/nvme0n1
  # Eaton 5S1600 via USB; Home Assistant's NUT integration asks for tech-hub
  ups:
    enabled: true
    name: tech-hub

# required network settings
network:
  domain: vie.internal.muehlbachler.io

  wan:
    mac: "a8:b8:e0:03:40:bd"
    interface: wan0
    vlan: 31
    # line: 275 Mbit/s upload (bufferbloat grade C: +112 ms under upload load)
    shaping:
      upload: 245M
    v4:
      method: dhcp
    v6:
      method: dhcp6

  lan:
    mac: "a8:b8:e0:03:40:be"
    interface: lan0
    v4:
      address: 10.0.0.1
      netmask: 16
      network: 10.0.0.0
    v6:
      address: "2a01:aea0:dd3:25a::1"
      netmask: 64
      network: "2a01:aea0:dd3:25a::"
      public: true
      supernet: "2a01:aea0:dd3:25a::/64"

  trustedNetworks:
    v4:
      - 10.0.0.0/8
    v6:
      - "fc00::/7"
      - "2001:678:dc0::/48"

  additionalRoutableNetworks:
    - prefix: "2001:678:dc0:100::/56"
      anchor: "2001:678:dc0:100::1"

