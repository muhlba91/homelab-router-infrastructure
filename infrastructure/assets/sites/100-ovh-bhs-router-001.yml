---
# required site settings
name: ovh-bhs-router-001
enabled: true

# optional deploy settings
deploy:
  automated: true

# required hardware settings
hardware:
  profile: server-zfs
  disks:
    - /dev/disk/by-id/nvme-SAMSUNG_MZVL2512HCJQ-00B07_S63CNX0TC11152
    - /dev/disk/by-id/nvme-SAMSUNG_MZVL2512HCJQ-00B07_S63CNX0TB24402
  kernelParams: ["console=tty0", "console=ttyS1,115200n8"]

hypervisor:
  enabled: true

system:
  watchdog: 0s
  autoReboot:
    enabled: true

# required network settings
network:
  domain: bhs.ovh.internal.muehlbachler.io

  wan:
    mac: "0c:c4:7a:95:f9:be"
    interface: wan0
    v4:
      method: static
      address: 149.56.26.87
      netmask: 24
      gateway: 149.56.26.254
      announce: false
    v6:
      method: static
      address: "2607:5300:61:b57::1"
      netmask: 128
      # outside the prefix: on-link
      gateway: "2607:5300:61:bff:ff:ff:ff:ff"
      onLink: true
      announce: false

  lan:
    mac: "bc:24:11:a7:8b:3e"
    interface: lan0
    bridge: true
    v4:
      address: 10.50.0.1
      netmask: 16
      network: 10.50.0.0
    v6:
      address: "fd9a:7707:457d::1"
      netmask: 48
      network: "fd9a:7707:457d::"
      public: false
      supernet: "fd9a:7707:457d::/48"

  trustedNetworks:
    v4:
      - 10.0.0.0/8
    v6:
      - "fc00::/7"
      - "2001:678:dc0::/48"
    wan: false

  additionalRoutableNetworks:
    - prefix: "2001:678:dc0:200::/56"
      anchor: "2001:678:dc0:200::1"

# required DHCP settings
dhcp:
  v4:
    start: 10.50.150.1
    end: 10.50.199.255
  v6:
    start: "fd9a:7707:457d:1::1"
    end: "fd9a:7707:457d:1::ffff"

# optional DNS settings
dns:
  conditionalForwards:
    vie.internal.muehlbachler.io: 10.0.0.1
    fra.hetzner.internal.muehlbachler.io: 10.100.0.1

# optional firewall settings
firewall:
  services:
    ssh:
      from:
        - lan
        - trusted
        - wan

# optional security settings
security:
  crowdsec:
    console:
      enabled: true

# optional transport settings
transport:
  netbird:
    enabled: true

# required BGP settings
bgp:
  enabled: true
  asn: 201421
  evpn:
    enabled: true
    egress:
      enabled: true
