---
name: Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Pulumi Preview
    permissions:
      id-token: write
      contents: read
    outputs:
      checks: ${{ steps.checks.outputs.checks }}

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # Go comes from mise; setup-go only restores the module cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: infrastructure/go.sum

      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: import-secrets
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          path: ${{ secrets.VAULT_PATH }}
          role: ${{ secrets.VAULT_ROLE }}
          exportToken: true
          outputToken: true
          # login only: the secrets are read by fnox (fnox.toml), the same list as on the developer machines

      - name: Load secrets
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
        run: |
          fnox ci-redact
          fnox export --format json \
            | jq -r '.secrets | to_entries[]
                | if (.value | test("\n")) then error("multi-line value: \(.key)") else "\(.key)=\(.value)" end' \
            >> "$GITHUB_ENV"

      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: muhlba91
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:muhlba91

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: preview
          work-dir: infrastructure
          stack-name: prod
          refresh: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # outputs/keys/ holds the real keys and secrets after a preview: only sites/ may be uploaded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-preview
          path: infrastructure/outputs/sites/
          if-no-files-found: error
          retention-days: 1

      # The checks of the rendered site files (named by flake checks.nix): the deploy nodes and one per site.
      - run: |
          echo "checks=$(find infrastructure/outputs/sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rnc '["deploy-schema"] + [inputs | "site-" + .]')" >> "$GITHUB_OUTPUT"
        id: checks

  nix-preview:
    runs-on: ubuntu-latest
    name: Nix Preview
    needs:
      - preview
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.preview.outputs.checks) }}

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites-preview
          path: sites

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          nix build -L --no-link ".#checks.x86_64-linux.$CHECK" --override-input sites path:../sites
        working-directory: nix
        env:
          CHECK: ${{ matrix.check }}

  deploy:
    runs-on: ubuntu-latest
    name: Pulumi Deploy
    needs:
      - preview
      - nix-preview
    permissions:
      id-token: write
      contents: read
    outputs:
      sites: ${{ steps.sites.outputs.sites }}

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false

      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: import-secrets
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          path: ${{ secrets.VAULT_PATH }}
          role: ${{ secrets.VAULT_ROLE }}
          exportToken: true
          outputToken: true
          # login only: the secrets are read by fnox (fnox.toml), the same list as on the developer machines

      - name: Load secrets
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
        run: |
          fnox ci-redact
          fnox export --format json \
            | jq -r '.secrets | to_entries[]
                | if (.value | test("\n")) then error("multi-line value: \(.key)") else "\(.key)=\(.value)" end' \
            >> "$GITHUB_ENV"

      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: muhlba91
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:muhlba91

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: up
          work-dir: infrastructure
          stack-name: prod
          refresh: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The routers CI deploys (deploy.automated), in deploy order, from the site data `pulumi up` just wrote.
      - run: |
          echo "sites=$(./router sites | awk '$3 == "automated=true" { print $1 }' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
        id: sites
        working-directory: nix

  router-deploy:
    runs-on: ubuntu-latest
    name: Router Deploy
    needs:
      - deploy
    if: needs.deploy.outputs.sites != '[]'
    permissions:
      id-token: write
      contents: read
    # One router at a time, in deploy order (the lab first); a failure stops the rest.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        site: ${{ fromJSON(needs.deploy.outputs.sites) }}
    env:
      SITE: ${{ matrix.site }}

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: import-secrets
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          path: ${{ secrets.VAULT_PATH }}
          role: ${{ secrets.VAULT_ROLE }}
          exportToken: true
          outputToken: true
          # login only: the secrets are read by fnox (fnox.toml), the same list as on the developer machines

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: fnox vault

      - name: Load secrets
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          FNOX_PROFILE: host-deploy
        run: |
          fnox ci-redact
          fnox export --format json \
            | jq -r '.secrets | to_entries[]
                | if (.value | test("\n")) then error("multi-line value: \(.key)") else "\(.key)=\(.value)" end' \
            >> "$GITHUB_ENV"

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      # The site data and this site's keys from the bucket, where `pulumi up` writes them locally (./router's default).
      - env:
          AWS_REGION: ${{ env.SCW_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCW_SECRET_KEY }}
        run: |
          umask 077
          aws s3 cp --recursive --only-show-errors --endpoint-url "https://s3.$AWS_REGION.scw.cloud" \
            "s3://$(yq '.config."homelab-router-infrastructure:bucketId"' Pulumi.prod.yaml)/router-infrastructure/prod/" \
            outputs/ --exclude "*" --include "sites/*" --include "keys/$SITE/*"
        working-directory: infrastructure

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          ./router deploy "$SITE"
        working-directory: nix

      - run: |
          health=$(./router health "$SITE") || rc=$?
          echo "$health"
          grep "^warn" <<< "$health" | while read -r line; do echo "::warning title=$SITE::$line"; done || true
          exit "${rc:-0}"
        working-directory: nix
