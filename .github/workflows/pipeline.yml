---
name: Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Pulumi Preview
    permissions:
      id-token: write
      contents: read
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
    strategy:
      max-parallel: 4
      matrix:
        go-version: [1.27.x]

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ matrix.go-version }}"
          cache-dependency-path: infrastructure/go.sum

      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: import-secrets
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          path: ${{ secrets.VAULT_PATH }}
          role: ${{ secrets.VAULT_ROLE }}
          exportToken: true
          outputToken: true
          secrets: |
            github-homelab-router-infrastructure/data/google-cloud region | CLOUDSDK_COMPUTE_REGION ;
            github-homelab-router-infrastructure/data/google-cloud workload_identity_provider | GOOGLE_WORKLOAD_IDENTITY_PROVIDER ;
            github-homelab-router-infrastructure/data/google-cloud ci_service_account | GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT ;
            github-homelab-router-infrastructure/data/scaleway organization_id | SCW_ORGANIZATION_ID ;
            github-homelab-router-infrastructure/data/scaleway project_id | SCW_PROJECT_ID ;
            github-homelab-router-infrastructure/data/scaleway region | SCW_DEFAULT_REGION ;
            github-homelab-router-infrastructure/data/scaleway zone | SCW_DEFAULT_ZONE ;
            github-homelab-router-infrastructure/data/scaleway access_key | SCW_ACCESS_KEY ;
            github-homelab-router-infrastructure/data/scaleway secret_key | SCW_SECRET_KEY

      - uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: muhlba91
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:muhlba91

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          command: preview
          work-dir: infrastructure
          stack-name: prod
          refresh: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # outputs/keys/ holds the real keys and secrets after a preview: only sites/ may be uploaded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-preview
          path: infrastructure/outputs/sites/
          if-no-files-found: error
          retention-days: 1

      # The checks of the rendered site files (named by flake checks.nix): the deploy nodes and one per site.
      - run: |
          echo "checks=$(find infrastructure/outputs/sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rnc '["deploy-schema"] + [inputs | "site-" + .]')" >> "$GITHUB_OUTPUT"
        id: checks

  nix-preview:
    runs-on: ubuntu-latest
    name: Nix Preview
    needs:
      - preview
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.preview.outputs.checks) }}

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites-preview
          path: sites

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          nix build -L --no-link ".#checks.x86_64-linux.$CHECK" --override-input sites path:../sites
        working-directory: nix
        env:
          CHECK: ${{ matrix.check }}

  deploy:
    runs-on: ubuntu-latest
    name: Pulumi Deploy
    needs:
      - preview
      - nix-preview
    permissions:
      id-token: write
      contents: read
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    strategy:
      max-parallel: 4
      matrix:
        go-version: [1.27.x]

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ matrix.go-version }}"
          cache-dependency-path: infrastructure/go.sum

      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: import-secrets
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          path: ${{ secrets.VAULT_PATH }}
          role: ${{ secrets.VAULT_ROLE }}
          exportToken: true
          outputToken: true
          secrets: |
            github-homelab-router-infrastructure/data/google-cloud region | CLOUDSDK_COMPUTE_REGION ;
            github-homelab-router-infrastructure/data/google-cloud workload_identity_provider | GOOGLE_WORKLOAD_IDENTITY_PROVIDER ;
            github-homelab-router-infrastructure/data/google-cloud ci_service_account | GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT ;
            github-homelab-router-infrastructure/data/scaleway organization_id | SCW_ORGANIZATION_ID ;
            github-homelab-router-infrastructure/data/scaleway project_id | SCW_PROJECT_ID ;
            github-homelab-router-infrastructure/data/scaleway region | SCW_DEFAULT_REGION ;
            github-homelab-router-infrastructure/data/scaleway zone | SCW_DEFAULT_ZONE ;
            github-homelab-router-infrastructure/data/scaleway access_key | SCW_ACCESS_KEY ;
            github-homelab-router-infrastructure/data/scaleway secret_key | SCW_SECRET_KEY

      - uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: muhlba91
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:muhlba91

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          command: up
          work-dir: infrastructure
          stack-name: prod
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The deployable routers, in deploy order, from the site data `pulumi up` just wrote.
      - run: |
          echo "sites=$(./router sites | awk '$2 == "deployable=true" { print $1 }' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
        id: sites
        working-directory: nix

  router-deploy:
    runs-on: ubuntu-latest
    name: Router Deploy
    needs:
      - deploy
    if: needs.deploy.outputs.sites != '[]'
    permissions:
      id-token: write
      contents: read
    # One router at a time, in deploy order (the lab first); a failure stops the rest.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        site: ${{ fromJSON(needs.deploy.outputs.sites) }}
    env:
      SITE: ${{ matrix.site }}

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: import-secrets
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          path: ${{ secrets.VAULT_PATH }}
          role: ${{ secrets.VAULT_ROLE }}
          exportToken: true
          outputToken: true
          secrets: |
            github-homelab-router-infrastructure/data/tailscale oauth_client_id | TS_OAUTH_CLIENT_ID ;
            github-homelab-router-infrastructure/data/tailscale oauth_secret | TS_OAUTH_SECRET ;
            github-homelab-router-infrastructure/data/scaleway region | AWS_REGION ;
            github-homelab-router-infrastructure/data/scaleway access_key | AWS_ACCESS_KEY_ID ;
            github-homelab-router-infrastructure/data/scaleway secret_key | AWS_SECRET_ACCESS_KEY

      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      # The site data and this site's keys from the bucket, where `pulumi up` writes them locally (./router's default).
      - run: |
          umask 077
          aws s3 cp --recursive --only-show-errors --endpoint-url "https://s3.$AWS_REGION.scw.cloud" \
            "s3://$(yq '.config."homelab-router-infrastructure:bucketId"' Pulumi.prod.yaml)/router-infrastructure/prod/" \
            outputs/ --exclude "*" --include "sites/*" --include "keys/$SITE/*"
        working-directory: infrastructure

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          ./router deploy "$SITE"
        working-directory: nix

      - run: |
          health=$(./router health "$SITE") || rc=$?
          echo "$health"
          grep "^warn" <<< "$health" | while read -r line; do echo "::warning title=$SITE::$line"; done || true
          exit "${rc:-0}"
        working-directory: nix
